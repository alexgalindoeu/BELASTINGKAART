name: Publish Belastingkaart

on:
  # Deployment stays manual: the owner decides when to publish.
  # Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Verify everything and package web/ as the Pages artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate:params
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::testthat
      - name: R testthat suite
        run: Rscript tests/testthat.R
      - name: Check generated browser parameters
        run: Rscript tools/export_parameters.R --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # 2) Deploy in a separate job, after the artifact is fully registered
  #    (GitHub's recommended layout; deploying in the same job can fail with
  #    "No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
