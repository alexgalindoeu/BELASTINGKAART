name: Belastingkaart CI

# Temporarily manual-only while the architecture is being ported.
# This prevents email noise from incomplete intermediate commits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate:params
      - run: npm run check:sitemap
      - run: npm run check:head
      - run: npm run check:validation
      - run: npm run check:zelfstandigen

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::testthat
      - name: R testthat suite
        run: Rscript tests/testthat.R
      - name: Check generated browser parameters
        run: Rscript tools/export_parameters.R --check
