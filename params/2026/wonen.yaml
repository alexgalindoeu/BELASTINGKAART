  effective_from: 2025-01-01
  effective_to: null
  source_name: Vlaamse Belastingdienst
  source_url: https://www.vlaanderen.be/belastingen-en-begroting/vlaamse-belastingen/registratiebelasting/verkooprecht/tarieven-in-het-verkooprecht/verlaagd-tarief-in-het-verkooprecht-voor-de-aankoop-van-de-enige-eigen-woning
  source_title: "Verlaagd tarief in het verkooprecht voor de aankoop van de enige eigen woning"
  retrieved_at: 2026-11-27
  unit: fraction_of_purchase_price
  rounding: not_applicable
  notes: >-
    Verbatim (re-checked 2026-11-27): 'Vanaf 1 januari 2025 betaalt u op de aankoop van een
    enige eigen woning nog maar 2% registratiebelasting. Dit tarief geldt voor authentieke
    aankoopaktes die verleden worden vanaf 1 januari 2025.'; 'Van 01/01/2022 tot en met
    31/12/2024 bedraagt het verlaagd tarief bij de aankoop van de enige eigen woning 3
    procent.'; 'Van 01/01/2020 tot en met 31/12/2021 bedroeg het verlaagd tarief [...] 6
    procent.'; 'Voor akten die verleden werden vóór 01/01/2020 bedroeg het tarief 7
    procent.' The period of each historical rate is stated in the quote; effective_from refers
    to the rate in force in 2026 (2 %). Conditions apply per buyer.

