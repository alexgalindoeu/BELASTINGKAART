  effective_to: null
  source_name: Vlaamse Belastingdienst
  source_url: https://www.vlaanderen.be/belastingen-en-begroting/vlaamse-belastingen/registratiebelasting/verkooprecht/tarieven-in-het-verkooprecht/verlaagd-tarief-in-het-verkooprecht-voor-de-aankoop-van-de-enige-eigen-woning
  source_title: "Wijziging tarief enige woning naar 3% vanaf 1 januari 2027 (aankondiging)"
  retrieved_at: 2026-11-27
  unit: fraction_of_purchase_price
  rounding: not_applicable
  notes: >-
    Verbatim: 'In de Septemberverklaring heeft de Vlaamse Regering de intentie geuit om het
    verlaagd tarief in het verkooprecht voor de aankoop van de enige eigen woning vanaf 1
    januari 2027 aan te passen naar 3%. In standpunt 26021 wordt de werkwijze toegelicht,
    onder voorbehoud dat door de decreetgever geen afwijkende regeling uitgewerkt wordt.'
    Provisional: an announced intention, not yet a decree. Shown only as an announcement
    ('announced: true'); never usable in a calculation.

