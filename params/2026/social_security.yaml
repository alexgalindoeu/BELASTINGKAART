      Do not generalise this rate to all public-sector categories or special regimes.
  work_bonus:
    # Sociale werkbonus (reduction of the 13.07% personal contribution), RSZ DmfA
    # administrative instructions. Transcribed from www.socialsecurity.be on 2026-11-24;
    # NL and FR versions and the tussentijdse instructies agree on every amount.
    method:
      value:
        reference_wage: 'S = W (J = D); S = (W/J) x D (J < D); part-time: S = (W/H) x U'
        wage_fraction_rounding: half_up_eurocent
        prestation_fraction_rounding: half_up_two_decimals
        prestation_fraction_cap: 1
        wage_base_percentage: 100
        basic_amount_rounding: half_up_eurocent
        reduction_rounding: eurocent_per_official_examples
        contribution_cap_order: [luik_b, luik_a]
        annual_cap_application: null
      status: provisional
      jurisdiction: federal
      income_year: 2026
      assessment_year: null
      effective_from: 2026-01-01
      effective_to: null
      source_name: RSZ / ONSS
      source_url: https://www.socialsecurity.be/employer/instructions/dmfa/nl/latest/instructions/deductions/workers_reductions/workbonus.html
      source_title: Administratieve instructies RSZ 2026/3 — Werkbonus, berekening in drie stappen
      retrieved_at: 2026-11-24
      unit: method
      rounding: "W/J and W/H: nearest eurocent (0,005 EUR wordt 0,01 EUR); J/D and H/U: two decimals (0,005 wordt 0,01), max 1; R: rekenkundig afgerond op de dichtstbijzijnde eurocent"
      notes: >-
        Verbatim rules: S is based on the gross wage at 100% for both arbeiders and
        bedienden; P = R (full prestaties), P = (J/D) x R or P = (H/U) x R; P may not exceed
        the personal social-security contributions due, and any shortfall is cut first from
        luik B and then from luik A. J and H count prestatiecodes 1, 3, 4, 5, 20 and, from
        version 2026/3, 38. Provisional because (1) rounding P to the eurocent is only
        shown in the official worked examples, not stated as a rule; (2) how the annual cap
        applies when it changes within the year is not stated; (3) the meaning and effective
        date of prestatiecode 38 are not given. Exclusions from W (looncodes 3, 6, 13, 14,
        15, 16, 22, 23, end-of-year premiums up to S, departure holiday pay) and the flat
        80,57 EUR reduction of S for a limited group of employers are not modelled.
    periods:
      '2026_01':
        value:
          luik_a:
            threshold: 2833.36
            upper: 3271.48
            bedienden: {max: 123.00, slope: 0.2807}
