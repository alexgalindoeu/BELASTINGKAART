meta:
  country: BE
  jurisdiction: federal
  income_year: 2026
  assessment_year: 2027
  status: partial
  notes: >-
    The progressive federal personal income tax scale and basic personal tax
    allowance are sourced from FPS Finance for income year 2026 / assessment year
    2027. This is not a complete salary-net calculation: professional expenses,
    family increases, tax reductions, municipal surcharge and withholding rules
    still need separate official documentation.

