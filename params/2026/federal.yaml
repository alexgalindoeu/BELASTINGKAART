  brackets:
    value:
      - upper: 16720
        rate: 0.25
      - upper: 29510
        rate: 0.40
      - upper: 51070
        rate: 0.45
      - upper: null
        rate: 0.50
    status: confirmed
    jurisdiction: federal
    income_year: 2026
    assessment_year: 2027
    effective_from: 2026-01-01
    effective_to: 2026-12-31
    source_name: FPS Finance / FOD Financiën
    source_url: https://finances.belgium.be/en/private-individuals/tax-return/income/tax-rates
    source_title: Tax rates — income tax year 2026 (assessment year 2027)
    retrieved_at: 2026-11-24
    unit: EUR_taxable_income_and_marginal_rate
    rounding: pending_official_calculation_rule
    notes: >-
      Official brackets: 25% up to EUR 16,720; 40% from EUR 16,720 to 29,510;
      45% from EUR 29,510 to 51,070; 50% above EUR 51,070. Applied to taxable
      income, not directly to gross salary.
  basic_personal_tax_allowance:
    value: 11550
    status: confirmed
    jurisdiction: federal
    income_year: 2026
    assessment_year: 2027
    effective_from: 2026-01-01
    effective_to: 2026-12-31
    source_name: FPS Finance / FOD Financiën
    source_url: https://finances.belgium.be/en/private-individuals/tax-return/income/tax-rates
    source_title: Tax rates — personal tax allowance, income tax year 2026
    retrieved_at: 2026-11-24
    unit: EUR
    rounding: not_applicable_to_threshold
    notes: >-
      Basic allowance only. It may increase depending on personal circumstances.
      Do not treat this amount alone as the final tax reduction; the legal
      calculation of the tax on the allowance and family increases must be modelled.
