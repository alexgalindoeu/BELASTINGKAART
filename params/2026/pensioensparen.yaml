  notes: >-
    Verbatim: '1°bis tegen een aanslagvoet van 8 %: spaartegoeden, kapitalen en afkoopwaarden
    gevormd in het kader van het pensioensparen [...] wanneer zij aan de rechthebbende worden
    uitgekeerd naar aanleiding van zijn pensionering op de normale datum of in één van de 5
    jaren die aan die datum voorafgaan, of naar aanleiding van het overlijden'; 'g)
    spaartegoeden, kapitalen en afkoopwaarden als vermeld in 1°bis, indien anders
    uitgekeerd;' (33 %); 'd) kapitalen en afkoopwaarden van de levensverzekeringscontracten
    [...] bij overlijden van de verzekerde of bij het normale verstrijken van het contract,
    of [...] in één van de 5 jaren die aan het normale verstrijken van het contract
    voorafgaan' (10 %); 'f) afkoopwaarden als vermeld in 2°, d, indien anders vereffend;'
    (33 %). Separate taxation unless globalisation is more favourable.
