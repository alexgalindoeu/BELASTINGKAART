  rounding: not_applicable
  notes: >-
    Verbatim: '§ 2. De taks wordt vastgesteld op 10 pct.:'; '§ 2/1. In afwijking van § 2 wordt
    de taks vastgesteld op 8 pct. voor de theoretische afkoopwaarde van de spaarverzekeringen
    in het kader van pensioensparen en op het spaartegoed geplaatst op een collectieve of
    individuele spaarrekening gevestigd voor het pensioensparen.'; 'wordt de taks vastgesteld
    op 33 pct.' (payment under art. 171, 1°, f and g); '§ 4. Gedurende de jaren 2015 tot 2019
    wordt elk jaar een vervroegde inning van 1 pct. uitgevoerd van de taks als bedoeld in §
    2/1.' The 1 % is a historical levy (2015–2019), shown only as such; it is deducted from the
    tax due at 60 (art. 186). Long-term savings tax is not tied to an assessment year.

