meta:
  country: BE
  jurisdiction: federal
  income_year: 2026
  assessment_year: 2027
  status: partial
  notes: >-
    Payroll withholding and annual tax liability are different concepts. The 2026
    bedrijfsvoorheffing rules for monthly wages of resident employees are transcribed from
    Bijlage III KB/WIB 92 and the FOD sleutelformule on Fisconet
    (docs/sources/bedrijfsvoorheffing_2026_fisconet.md). No withholding engine exists yet;
    the dispatcher keeps blocking.

professional_withholding:
  # Bedrijfsvoorheffing / précompte professionnel on MONTHLY wages of RESIDENT EMPLOYEES
  # (werknemers, rijksinwoners). Bedrijfsleiders, pensions, non-residents, pay other than
  # monthly and exceptional pay (holiday pay, 13th month) are out of scope.
  # Periods refer to the date the income is PAID OR ATTRIBUTED ('betaald of toegekend').
  # The keys at this level are not a parameter: there is deliberately no top-level
  # `status`, so R/07_dispatch.R keeps listing 'professional withholding' as missing until
  # an engine and a completeness check are written.
  method:
    value:
      scope: monthly wages of resident employees (Bijlage III Deel 3; sleutelformule Deel I, Hoofdstuk 1)
      step_a_gross_annual: (monthly gross paid - compulsory social-security withholdings) x 12
      step_b_net_taxable: gross annual - flat-rate professional expenses (period table)
      step_c_basic_tax: base scale on net taxable annual income, minus tax on the tax-free sum; spouse without own professional income -> huwelijksquotiënt (30% share, capped) and twice the tax on the tax-free sum
      step_c_reductions: children (table) + other family burdens (tables); total reductions capped at the basic tax
      step_d_monthly: annual tax / 12
      step_e_order: [group_insurance_30pct, overtime, work_bonus, low_income_public_sector]
      floor_at_zero: true
      rounding: half_up_eurocent_every_step
      family_situation_reference_date: 1 January of the year of payment (employer may apply a change once informed)
      surcharge_built_in: 0.07
      spouse_pension_only_exception_net_monthly_max: 174
      spouse_net_income_test: (gross professional income - compulsory social withholdings) x 0.80
      legal_cohabitants_equal_to_spouses: true
      disabled_dependant_counts_double: true
    status: confirmed
    jurisdiction: federal
    income_year: 2026
    assessment_year: 2027
    effective_from: 2026-01-01
    effective_to: 2026-12-31
    source_name: FOD Financiën / SPF Finances — Fisconet
    source_url: https://www.minfin.fgov.be/myminfin-web/pages/public/fisconet/document/a38f6c59-3ab9-49d3-8844-d39f91387663
    source_title: Regels 1 januari 2026 — Bijlage III KB/WIB 92 (KB 11.12.2025), nrs. 2, 5, 8, 11, 12, 25.1, 26, 28, 31–34, 37–43
    retrieved_at: 2026-11-25
    unit: method
    rounding: "nr. 12: alle bedragen, in voorkomend geval in elke stap, afgerond tot de hogere of lagere cent, naargelang het cijfer van de duizendsten al dan niet 5 bereikt"
    notes: >-
      Method for regular monthly wages only, identical in the original Bijlage III (KB
      11.12.2025) and in the coordinated version after KB 24.07.2026 and KB 27.09.2026
      (b14d7617-e298-4210-ab8f-dbb3bced2922), and in both sleutelformules (821b117c-...,
      905faa6f-...). Sleutelformule nr. 5: 'reeds rekening gehouden met een verhoging van 7
      pct. voor de aanvullende belastingen (gemeente- en agglomeratiebelasting)', so the
      withholding does not depend on the municipality. Nr. 21: 'De toepassing van de
      verminderingen kan er niet toe leiden dat de bedrijfsvoorheffing negatief wordt.'
      The work-bonus reduction uses the SOCIAL work bonus 'dat daadwerkelijk is verleend'
      (luik A / luik B), which is pending for Oct–Dec 2026 (social_security.yaml).
      Exceptional pay (nr. 53 and following), group insurance and overtime amounts are not
      modelled. Effective_to: Bijlage III 'inkomsten 2026'.
  periods:
    '2026_01':
      value:
        professional_expenses: {rate: 0.30, threshold_annual: 20233.33, maximum: 6070}
        base_scale:
          - {upper: 16710, rate: 0.2675}
          - {upper: 29500, rate: 0.4280, tax_at_lower: 4469.93}
          - {upper: 51050, rate: 0.4815, tax_at_lower: 9944.05}
          - {upper: null, rate: 0.5350, tax_at_lower: 20320.38}
        tax_free_sum: 11170
        tax_on_tax_free_sum: 2987.98
        marital_quotient:
          share: 0.30
          maximum: 13790
          maximum_reached_at: 45966.67
          tax_on_two_tax_free_sums: 5975.96
        children_reduction:
          by_count: {1: 624, 2: 1656, 3: 4404, 4: 7620, 5: 11100, 6: 14592, 7: 18120, 8: 21996}
          per_child_above_eight: 3864
        other_family_reductions:
          # nr. 39: both situations
          all:
            disabled_beneficiary: 624
            dependant_66_plus_in_care_per_person: 1992
            other_dependant_per_person: 624
          # nr. 40: single, or spouse with own professional income
          single_or_spouse_with_income:
